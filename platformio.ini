; Sensorium Vessel Firmware v0.2
; ESP32-WROOM (dev) / ESP32-S3 (production)
;
; Build:  pio run -e wroom
; Flash:  pio run -e wroom -t upload
; Monitor: pio device monitor
;
; Sensor flags: enable/disable individual sensors per build.
; Disabled sensors are compiled out entirely — no code, no pins, no libraries.

[platformio]
default_envs = wroom

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    fastled/FastLED@^3.9.0
    knolleary/PubSubClient@^2.8
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit Unified Sensor@^1.1.14
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    miguelbalboa/MFRC522@^1.4.11
    claws/BH1750@^1.3.0

[env:wroom]
platform = espressif32
board = esp32dev
build_flags =
    -DLED_PIN=13
    -DBUTTON_PIN=27
    -DNUM_LEDS=8
    -DWROOM_DEV=1
    ; ── Sensor enables ──
    ; Comment out any line to disable that sensor
    -DENABLE_BME280
    -DENABLE_DS18B20
    -DENABLE_BH1750
    -DENABLE_BATTERY
    -DENABLE_RFID
    ; ── Pin overrides (uncomment to change defaults) ──
    ; -DDS18B20_PIN=4
    ; BH1750 uses I2C (shared with BME280)
    ; -DBATTERY_PIN=35
    ; -DRFID_SS_PIN=5
    ; -DRFID_RST_PIN=15
    ; -DI2C_SDA_PIN=21
    ; -DI2C_SCL_PIN=22
    ; -DBATTERY_DIVIDER_RATIO=2.0

[env:s3]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags =
    -DLED_PIN=48
    -DBUTTON_PIN=4
    -DNUM_LEDS=8
    -DS3_PROD=1
    -DENABLE_BME280
    -DENABLE_DS18B20
    -DENABLE_BH1750
    -DENABLE_BATTERY
    -DENABLE_RFID
    ; S3 pin assignments (adjust for your board)
    ; -DDS18B20_PIN=5
    ; BH1750 uses I2C (shared with BME280)
    ; -DBATTERY_PIN=7
    ; -DRFID_SS_PIN=10
    ; -DRFID_RST_PIN=11

[env:wroom-ota]
extends = env:wroom
upload_protocol = espota
upload_port = vessel-nyx.local
; Falls back to IP if mDNS fails:
; upload_port = 192.168.1.32

[env:xiao-s3]
platform = espressif32
board = seeed_xiao_esp32s3
build_flags =
    -DLED_PIN=2
    -DBUTTON_PIN=3
    -DNUM_LEDS=8
    -DXIAO_S3=1
    ; ── Sensor enables ──
    -DENABLE_BME280
    -DENABLE_DS18B20
    -DENABLE_BH1750
    -DENABLE_BATTERY
    -DENABLE_RFID
    ; ── XIAO S3 pin assignments ──
    -DDS18B20_PIN=1
    -DBATTERY_PIN=4
    -DRFID_SS_PIN=44
    -DRFID_RST_PIN=43
    -DI2C_SDA_PIN=5
    -DI2C_SCL_PIN=6
