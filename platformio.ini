; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = wroom

[env]
framework = arduino
monitor_speed = 115200
lib_deps = 
	fastled/FastLED@^3.9.0
	knolleary/PubSubClient@^2.8
	adafruit/Adafruit BME280 Library@^2.2.4
	adafruit/Adafruit Unified Sensor@^1.1.14
	paulstoffregen/OneWire@^2.3.8
	milesburton/DallasTemperature@^3.11.0
	miguelbalboa/MFRC522@^1.4.11
	claws/BH1750@^1.3.0

[env:wroom]
platform = espressif32
board = esp32dev
build_flags = 
	-DLED_PIN=13
	-DBUTTON_PIN=27
	-DNUM_LEDS=8
	-DWROOM_DEV=1
	-DENABLE_BME280
	-DENABLE_DS18B20
	-DENABLE_ACCEL
	-DENABLE_RADAR
	-DENABLE_BH1750
	-DENABLE_BATTERY
	-DENABLE_RFID

[env:s3]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags = 
	-DLED_PIN=48
	-DBUTTON_PIN=4
	-DNUM_LEDS=8
	-DS3_PROD=1
	-DENABLE_BME280
	-DENABLE_DS18B20
	-DENABLE_ACCEL
	-DENABLE_RADAR
	-DENABLE_BH1750
	-DENABLE_BATTERY
	-DENABLE_RFID

[env:wroom-ota]
extends = env:wroom
upload_protocol = espota
upload_port = 192.168.1.32

[env:xiao-s3]
platform = espressif32
board = seeed_xiao_esp32s3
lib_deps = 
	fastled/FastLED@^3.9.13
	knolleary/PubSubClient@^2.8
	adafruit/Adafruit Unified Sensor@^1.1.14
	adafruit/Adafruit BME280 Library@^2.2.4
	paulstoffregen/OneWire@^2.3.8
	milesburton/DallasTemperature@^3.11.0
	claws/BH1750@^1.3.0
	miguelbalboa/MFRC522@^1.4.11
	adafruit/Adafruit BusIO@^1.16.2
	adafruit/Adafruit PN532@^1.3.4
build_flags = 
	-DLED_PIN=2
	-DBUTTON_PIN=3
	-DNUM_LEDS=8
	-DXIAO_S3=1
	-DENABLE_BME280
	-DENABLE_DS18B20
	-DENABLE_ACCEL
	-DENABLE_RADAR
	-DENABLE_BH1750
	-DENABLE_BATTERY
	-DENABLE_NFC_I2C
	; XIAO silkscreen D-labels ≠ GPIO numbers!
	; D4=GPIO5(SDA), D5=GPIO6(SCL), D6=GPIO43(TX), D7=GPIO44(RX)
	; Use GPIO numbers here, wire to D-labels on the board.
	-DDS18B20_PIN=1
	-DBATTERY_PIN=4
	-DRFID_SS_PIN=44
	-DRFID_RST_PIN=43
	; Wire to D4 and D5 on the board for I2C
	; NOTE: XIAO silkscreen D4=GPIO5(SDA), D5=GPIO6(SCL)
	-DI2C_SDA_PIN=5
	-DI2C_SCL_PIN=6
